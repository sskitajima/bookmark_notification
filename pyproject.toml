[project]
name = "bookmark-notification"
version = "0.1.0"
description = "Bookmark notification tool that randomly selects bookmarks and sends them via email"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
    "pyyaml>=6.0",
]
